{% extends "base_dashboard.html" %}

{% block content %}

<div class="student-form-header">

    <div>

        <h2>Add New Student</h2>

        <p>
            Create a new student record in the database.
        </p>

    </div>

    <a href="/students" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
        Back to Students
    </a>

</div>


<div class="student-form-card">

    <div class="form-section-title">

        <i class="bi bi-person-vcard"></i>

        <div>

            <h4>Student Information</h4>

            <p>
                Enter the student's details below.
            </p>

        </div>

    </div>


    <form method="POST">

        <!-- Admission Number -->

        <div class="mb-4">

            <label class="form-label">
                Admission Number
            </label>

            <input
                type="number"
                name="admno"
                class="form-control"
                placeholder="Enter admission number"
                required>

        </div>


        <!-- First + Last Name -->

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    First Name
                </label>

                <input
                    type="text"
                    name="fname"
                    class="form-control"
                    placeholder="Enter first name"
                    required>

            </div>


            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Last Name
                </label>

                <input
                    type="text"
                    name="lname"
                    class="form-control"
                    placeholder="Enter last name"
                    required>

            </div>

        </div>


        <!-- Roll + Mobile -->

        <div class="row">

            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Roll Number
                </label>

                <input
                    type="number"
                    name="roll"
                    class="form-control"
                    placeholder="Enter roll number"
                    required>

            </div>


            <div class="col-md-6 mb-4">

                <label class="form-label">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    name="mobno"
                    class="form-control"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    required>

            </div>

        </div>


        <!-- Buttons -->

        <div class="form-actions">

            <a
                href="/students"
                class="btn btn-light">

                Cancel

            </a>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="bi bi-person-plus-fill"></i>

                Add Student

            </button>

        </div>

    </form>

</div>

{% endblock %}
