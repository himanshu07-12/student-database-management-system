{% extends "base_dashboard.html" %}

{% block content %}

<h2 class="mb-4">Add Student</h2>

<form method="POST">

    <div class="mb-3">
        <label>Admission Number</label>
        <input class="form-control"
               type="number"
               name="admno"
               required>
    </div>

    <div class="mb-3">
        <label>First Name</label>
        <input class="form-control"
               type="text"
               name="fname"
               required>
    </div>

    <div class="mb-3">
        <label>Last Name</label>
        <input class="form-control"
               type="text"
               name="lname"
               required>
    </div>

    <div class="mb-3">
        <label>Roll Number</label>
        <input class="form-control"
               type="number"
               name="roll"
               required>
    </div>

    <div class="mb-3">
        <label>Mobile Number</label>
        <input class="form-control"
               type="number"
               name="mobno"
               required>
    </div>

    <button class="btn btn-success">
        Add Student
    </button>

</form>

{% endblock %}
