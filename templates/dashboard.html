{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Student Database Dashboard
    </h2>

    <div class="row mb-4">

         <h3 class="text-center mb-4">
            Welcome, {{ session["user"] }} 👋
        </h3>

        <div class="col-md-6">


            <div class="card shadow-lg border-0 text-center">

                <div class="card-body">

                    <i class="bi bi-people-fill display-4 text-primary"></i>

                    <h1>{{ student_count }}</h1>

                    <h5>Total Students</h5>

                 </div>

            </div>

        </div>

        <div class="col-md-6">

           <div class="card shadow-lg border-0 text-center">

                <div class="card-body">

                    <i class="bi bi-person-circle display-4 text-success"></i>

                    <h1>{{ user_count }}</h1>

                    <h5>Total Users</h5>

                 </div>

            </div>

        </div>

    </div>

 <div class="row g-4">

    <div class="col-md-6">

        <a href="/students" class="text-decoration-none">

            <div class="card dashboard-card shadow border-0 h-100">

                <div class="card-body text-center">

                    <i class="bi bi-people-fill display-4 text-primary"></i>

                    <h4 class="mt-3">View Students</h4>

                </div>

            </div>

        </a>

    </div>

    <div class="col-md-6">

        <a href="/add" class="text-decoration-none">

            <div class="card dashboard-card shadow border-0 h-100">

                <div class="card-body text-center">

                    <i class="bi bi-person-plus-fill display-4 text-success"></i>

                    <h4 class="mt-3">Add Student</h4>

                </div>

            </div>

        </a>

    </div>

    <div class="col-md-6">

        <a href="/search" class="text-decoration-none">

            <div class="card dashboard-card shadow border-0 h-100">

                <div class="card-body text-center">

                    <i class="bi bi-search display-4 text-warning"></i>

                    <h4 class="mt-3">Search Student</h4>

                </div>

            </div>

        </a>

    </div>

    <div class="col-md-6">

        <a href="/export" class="text-decoration-none">

            <div class="card dashboard-card shadow border-0 h-100">

                <div class="card-body text-center">

                    <i class="bi bi-download display-4 text-info"></i>

                    <h4 class="mt-3">Export CSV</h4>

                </div>

            </div>

        </a>

    </div>

</div>

    <div class="text-center mt-4">

        <a href="/logout" class="btn btn-danger px-5">
            🚪 Logout
        </a>

    </div>

</div>
{% endblock %}
