{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Student Database Dashboard
    </h2>

    <div class="row mb-4">

        <div class="col-md-6">

            <h3 class="mb-4">
                Welcome, {{ session["user"] }} 👋
            </h3>

            <div class="card shadow-lg border-0 text-center">

                <div class="card-body">

                    <h5>Total Students</h5>

                    <h1>{{ student_count }}</h1>

                </div>

            </div>

        </div>

        <div class="col-md-6">

           <div class="card shadow-lg border-0 text-center">

                <div class="card-body">

                    <h5>Total Users</h5>

                    <h1>{{ user_count }}</h1>

                </div>

            </div>

        </div>

    </div>

    <div class="row g-3">

        <div class="col-md-6">
            <a href="/students" class="btn btn-primary w-100 p-3">
                <i class="bi bi-people-fill"></i>
                View Students
            </a>
        </div>

        <div class="col-md-6">
            <a href="/add" class="btn btn-success w-100 p-3">
                ➕ Add Student
            </a>
        </div>

        <div class="col-md-6">
            <a href="/search" class="btn btn-warning w-100 p-3">
                🔍 Search Student
            </a>
        </div>

        <div class="col-md-6">
            <a href="/export" class="btn btn-info w-100 p-3">
                📥 Export CSV
            </a>
        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/logout" class="btn btn-danger px-5">
            🚪 Logout
        </a>

    </div>

</div>
{% endblock %}
